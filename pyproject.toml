[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "caseview"
version = "0.1.0"
description = "Drive PC case displays and case RGB lighting from your own sensors."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "CaseView contributors" }]
keywords = ["case display", "hardware monitor", "rgb", "openrgb", "librehardwaremonitor", "tray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]
dependencies = ["hidapi>=0.14", "pythonnet>=3.0", "tomli-w>=1.0", "PySide6>=6.7", "psutil>=6"]

[project.urls]
Homepage = "https://github.com/OWNER/caseview"
Documentation = "https://github.com/OWNER/caseview#readme"
Issues = "https://github.com/OWNER/caseview/issues"
Changelog = "https://github.com/OWNER/caseview/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-psutil"]

[project.scripts]
caseview = "caseview.cli:main"

[project.entry-points."caseview.drivers"]
crystalx-v331 = "caseview.drivers.crystalx_v331:CrystalXV331"

[tool.hatch.build.targets.wheel]
packages = ["src/caseview"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["hid", "pythonnet", "clr", "LibreHardwareMonitor.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

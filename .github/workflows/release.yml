name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev,build]
      - run: pytest -q
      - run: python -I tools/fetch_lhm.py
      - run: python -I tools/build.py
      - name: Zip
        shell: pwsh
        run: |
          $name = "CaseView-${{ github.ref_name }}-win64.zip"
          Compress-Archive -Path dist/CaseView/* -DestinationPath $name
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  " + $name | Out-File "$name.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: CaseView-win64
          path: CaseView-*-win64.zip*
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            CaseView-*-win64.zip
            CaseView-*-win64.zip.sha256
          generate_release_notes: true
